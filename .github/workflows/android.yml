name: Android debug APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Native cache policy tests
        run: |
          bash scripts/test-native-policy.sh
          python3 scripts/test-search-sql.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Prepare llama.cpp
        run: bash scripts/setup-native.sh
      - name: Unit tests, lint and debug APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Verify optimized inference kernels
        run: python3 scripts/verify-native-optimization.py
      - name: Static project checks
        run: python3 scripts/check-project.py
      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-personal-debug-arm64
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            native/llama-revision.txt
  model-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare pinned llama.cpp
        run: bash scripts/setup-native.sh
      - name: Build shared application renderer and sampler for CPU tests
        run: |
          cmake -S scripts/model-integration -B scripts/model-integration/build
          cmake --build scripts/model-integration/build --target atlas-model-runner -j 2
      - name: Probe optional public encyclopedia endpoint
        continue-on-error: true
        run: python3 scripts/check-knowledge-live.py
      - name: Run Qwen3, Gemma 3 and Qwen2.5 GGUF inference
        run: python3 scripts/test-real-model.py
      - name: Validate actual output using application Kotlin presentation
        env:
          ATLAS_MODEL_RESULTS: ${{ github.workspace }}/model-smoke
        run: gradle -p integration --no-daemon test
      - name: Check Portuguese and mixed-language output
        run: |
          python3 -m pip install 'langid==1.1.6' 'numpy==2.2.6'
          python3 scripts/audit-model-language.py
      - name: Upload actual prompts, responses, identities and tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gguf-model-integration
          path: |
            knowledge-smoke/*.json
            model-smoke/*.json
            model-smoke/system.txt
            model-smoke/*-official-model-card.md
            integration/build/reports/
