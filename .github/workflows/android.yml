name: Android debug APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Native cache policy tests
        run: bash scripts/test-native-policy.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Prepare llama.cpp
        run: bash scripts/setup-native.sh
      - name: Unit tests, lint and debug APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Verify optimized inference kernels
        run: python3 scripts/verify-native-optimization.py
      - name: Static project checks
        run: python3 scripts/check-project.py
      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-personal-debug-arm64
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            native/llama-revision.txt
  real-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned llama.cpp
        run: bash scripts/setup-native.sh
      - name: Build Linux CPU inference runner
        run: |
          cmake -S native/llama.cpp -B native/llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF
          cmake --build native/llama.cpp/build --target llama-cli -j 2
      - name: Test actual Qwen answers with application prompt
        run: python3 scripts/test-real-model.py
      - name: Upload actual responses and model identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-real-model-smoke
          path: |
            model-smoke/results.json
            model-smoke/system.txt
